<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Gautam Baghel</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=2">
    <link rel="alternate icon" type="image/png" href="images/favicon.png?v=2">
    <link rel="stylesheet" href="assets/css/modern.css?v=20261112b">
    <link rel="stylesheet" href="assets/css/blog.css?v=20261112b">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-brand">
            <a href="index.html">GB</a>
        </div>
        <button class="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="blog.html" class="active">Blog</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

    <main class="blog-main">
        <section class="blog-hero">
            <div class="container">
                <h1>Blog</h1>
                <p>Thoughts on Generative AI, Automation, and Software Development</p>
            </div>
        </section>

        <section class="blog-content">
            <div class="container">
                <div class="blog-layout">
                    <aside class="blog-sidebar">
                        <div class="sidebar-section">
                            <h3>Categories</h3>
                            <ul class="category-list">
                                <li>
                                    <button class="category-btn active" data-category="all">
                                        <i class="fa-solid fa-layer-group"></i>
                                        <span>All Posts</span>
                                    </button>
                                </li>
                                <li>
                                    <button class="category-btn" data-category="hashicorp">
                                        <i class="fa-solid fa-cloud"></i>
                                        <span>HashiCorp (IBM)</span>
                                    </button>
                                </li>
                                <li>
                                    <button class="category-btn" data-category="blackduck">
                                        <i class="fa-solid fa-shield-halved"></i>
                                        <span>Black Duck (Synopsys)</span>
                                    </button>
                                </li>
                                <li>
                                    <button class="category-btn" data-category="personal">
                                        <i class="fa-solid fa-pen-nib"></i>
                                        <span>Personal</span>
                                    </button>
                                </li>
                            </ul>
                        </div>
                        <div class="sidebar-section">
                            <h3>Tags</h3>
                            <div class="tag-cloud" id="tagCloud"></div>
                        </div>
                    </aside>

                    <div class="blog-posts">
                        <div class="posts-header">
                            <h2 id="categoryTitle">All Posts</h2>
                            <span class="post-count" id="postCount"></span>
                        </div>
                        <div class="posts-grid" id="postsGrid">
                            <!-- Posts will be dynamically loaded -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>Designed & Built by Gautam Baghel</p>
        </div>
    </footer>

    <script>
        // Mobile navigation toggle
        var navToggle = document.querySelector('.nav-toggle');
        var navLinks = document.querySelector('.nav-links');

        navToggle.addEventListener('click', function() {
            navLinks.classList.toggle('active');
            navToggle.classList.toggle('active');
        });

        // Blog functionality
        // State lives in the URL so filters are linkable (e.g. from the
        // homepage expertise tiles): blog.html?tags=ai,mcp#hashicorp
        //   ?tags=  selected tags, comma separated; a post matches if it has ANY of them
        //   #hash   category (all | hashicorp | blackduck | personal)
        var CATEGORIES = ['all', 'hashicorp', 'blackduck', 'personal'];
        var TAG_CLOUD_LIMIT = 15;
        var blogsData = null;
        var state = { category: 'all', tags: [] };

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function readStateFromUrl() {
            var params = new URLSearchParams(window.location.search);
            var tags = (params.get('tags') || '').split(',')
                .map(function(t) { return t.trim().toLowerCase(); })
                .filter(function(t, i, arr) { return t && arr.indexOf(t) === i; });
            var hash = window.location.hash.substring(1);
            state.category = CATEGORIES.indexOf(hash) !== -1 ? hash : 'all';
            state.tags = tags;
        }

        function writeStateToUrl() {
            var url = window.location.pathname;
            if (state.tags.length) {
                url += '?tags=' + state.tags.map(encodeURIComponent).join(',');
            }
            if (state.category !== 'all') {
                url += '#' + state.category;
            }
            history.pushState(null, '', url);
        }

        function setState(changes) {
            if (changes.category !== undefined) state.category = changes.category;
            if (changes.tags !== undefined) state.tags = changes.tags;
            writeStateToUrl();
            render();
        }

        function toggleTag(tag) {
            var tags = state.tags.slice();
            var i = tags.indexOf(tag);
            if (i === -1) tags.push(tag); else tags.splice(i, 1);
            setState({ tags: tags });
        }

        function render() {
            renderCategoryButtons();
            renderTags();
            renderPosts();
        }

        // Fetch blogs data
        function fetchBlogs() {
            var postsGrid = document.getElementById('postsGrid');
            postsGrid.innerHTML = '<p class="loading-message">Loading posts...</p>';

            return fetch('blogs/blogs.json')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('HTTP error ' + response.status);
                    }
                    return response.json();
                })
                .then(function(data) {
                    blogsData = data;
                    render();
                    return data;
                })
                .catch(function(error) {
                    console.error('Error loading blogs:', error);
                    postsGrid.innerHTML = '<p class="error-message">Unable to load blog posts. Error: ' + escapeHtml(error.message) + '</p>';
                });
        }

        function renderCategoryButtons() {
            var allBtns = document.querySelectorAll('.category-btn');
            for (var i = 0; i < allBtns.length; i++) {
                allBtns[i].classList.toggle('active', allBtns[i].getAttribute('data-category') === state.category);
            }
        }

        // Render posts for the current category + tags
        function renderPosts() {
            var postsGrid = document.getElementById('postsGrid');
            var categoryTitle = document.getElementById('categoryTitle');
            var postCount = document.getElementById('postCount');

            if (!blogsData || !blogsData.posts) {
                postsGrid.innerHTML = '<p class="error-message">No blog data available.</p>';
                return;
            }

            var posts = blogsData.posts.filter(function(post) {
                if (state.category !== 'all' && post.category !== state.category) return false;
                if (!state.tags.length) return true;
                return (post.tags || []).some(function(t) { return state.tags.indexOf(t) !== -1; });
            });

            // Sort by date (newest first)
            posts.sort(function(a, b) {
                return new Date(b.date) - new Date(a.date);
            });

            // Update header
            var catInfo = blogsData.categories[state.category];
            var title = state.category === 'all' ? 'All Posts' : (catInfo ? catInfo.name : state.category);
            if (state.tags.length) {
                title = (state.category === 'all' ? '' : title + ' \u00b7 ') + 'Tagged: ' + state.tags.join(', ');
            }
            categoryTitle.textContent = title;
            postCount.textContent = posts.length + ' post' + (posts.length !== 1 ? 's' : '');

            if (posts.length === 0) {
                postsGrid.innerHTML = '<p class="no-posts">No posts match these filters yet.</p>';
                return;
            }

            postsGrid.innerHTML = posts.map(function(post) {
                var categoryInfo = blogsData.categories[post.category] || {};
                var date = new Date(post.date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                var tagsHtml = (post.tags || []).map(function(t) {
                    var active = state.tags.indexOf(t) !== -1 ? ' active' : '';
                    return '<span class="tag' + active + '" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>';
                }).join('');

                var externalBadge = post.external ? '<span class="external-badge"><i class="fa-solid fa-arrow-up-right-from-square"></i> External</span>' : '';

                return '<article class="post-card" data-post-id="' + escapeHtml(post.id) + '">' +
                    '<div class="post-category">' +
                        '<i class="' + escapeHtml(categoryInfo.icon || 'fa-solid fa-file-alt') + '"></i>' +
                        '<span>' + escapeHtml(categoryInfo.name || post.category) + '</span>' +
                    '</div>' +
                    '<h3 class="post-title">' + escapeHtml(post.title) + '</h3>' +
                    '<p class="post-excerpt">' + escapeHtml(post.excerpt) + '</p>' +
                    '<div class="post-meta">' +
                        '<span class="post-date">' +
                            '<i class="fa-regular fa-calendar"></i> ' +
                            escapeHtml(date) +
                        '</span>' +
                        externalBadge +
                    '</div>' +
                    '<div class="post-tags">' + tagsHtml + '</div>' +
                '</article>';
            }).join('');
        }

        // Tag cloud: top tags by count, plus any selected tag outside the top list
        function renderTags() {
            var tagCloud = document.getElementById('tagCloud');
            if (!blogsData || !blogsData.posts) return;

            var counts = {};
            blogsData.posts.forEach(function(post) {
                (post.tags || []).forEach(function(tag) {
                    counts[tag] = (counts[tag] || 0) + 1;
                });
            });

            var shown = Object.keys(counts)
                .sort(function(a, b) { return counts[b] - counts[a] || a.localeCompare(b); })
                .slice(0, TAG_CLOUD_LIMIT);
            state.tags.forEach(function(tag) {
                if (shown.indexOf(tag) === -1) shown.push(tag);
            });

            var html = shown.map(function(tag) {
                var active = state.tags.indexOf(tag) !== -1;
                return '<button class="tag-btn' + (active ? ' active' : '') + '" data-tag="' + escapeHtml(tag) +
                    '" aria-pressed="' + active + '">' + escapeHtml(tag) + ' <span>(' + (counts[tag] || 0) + ')</span></button>';
            }).join('');
            if (state.tags.length) {
                html += '<button class="tag-clear" type="button">Clear tags</button>';
            }
            tagCloud.innerHTML = html;
        }

        // Event delegation (elements are re-rendered on every state change)
        document.getElementById('tagCloud').addEventListener('click', function(e) {
            if (e.target.closest('.tag-clear')) {
                setState({ tags: [] });
                return;
            }
            var btn = e.target.closest('.tag-btn');
            if (btn) toggleTag(btn.getAttribute('data-tag'));
        });

        document.getElementById('postsGrid').addEventListener('click', function(e) {
            var tag = e.target.closest('.post-tags .tag');
            if (tag) {
                toggleTag(tag.getAttribute('data-tag'));
                return;
            }
            var card = e.target.closest('.post-card');
            if (card && card.getAttribute('data-post-id')) {
                window.location.href = 'post.html?id=' + encodeURIComponent(card.getAttribute('data-post-id'));
            }
        });

        var categoryBtns = document.querySelectorAll('.category-btn');
        for (var i = 0; i < categoryBtns.length; i++) {
            categoryBtns[i].addEventListener('click', function(e) {
                setState({ category: e.currentTarget.getAttribute('data-category') });
            });
        }

        // Back/forward and manual hash edits
        window.addEventListener('popstate', function() {
            readStateFromUrl();
            if (blogsData) render();
        });

        document.addEventListener('DOMContentLoaded', function() {
            readStateFromUrl();
            fetchBlogs();
        });
    </script>
</body>
</html>
